const $=s=>document.querySelector(s);

const AGES=['8 ans ou moins','9-10 ans','11-12 ans','13-14 ans','15-16 ans','17-19 ans','20-29 ans','31-39 ans','40 ans et +'];
const ageIdx=a=>{const i=AGES.indexOf(a);return i<0?99:i};
const swSort=(a,b)=>ageIdx(a.age)-ageIdx(b.age)||a.prenom.localeCompare(b.prenom,'fr')||a.nom.localeCompare(b.nom,'fr');
const ageHead=(l,s,i)=>!i||l[i-1][1].age!==s.age?`<h2 style="margin:14px 2px 6px">${esc(s.age||'Sans catégorie')}</h2>`:'';
const sessCount=()=>Object.values(db.tr).reduce((n,a)=>n+a.length,0);

/* ── État ── */
let S={tab:'home',f:{saison:'',nage:'',dist:'',hf:'',age:'',club:'',q:''},
  ses:{date:isoNow(),nage:'',dist:'',q:'',ep:{},vals:{},obs:{},open:''},nv:'asvf',nq:'',sheet:null,pdf:null,pdfdate:''};
const TABS=[['home','🏠','Accueil'],['res','📋','Résultats'],['ses','⏱️','Séance'],['sw','🏊','Nageurs'],['set','⚙️','Réglages']];

/* ── Pages ── */
function pgHome(){
  const last=db.imp[0]?db.imp[0].label:'—';
  const nas=Object.entries(db.sw).filter(([id,s])=>s.asvf&&!db.hid.includes(id)).length;
  const rec=[];Object.entries(db.tr).forEach(([id,a])=>a.forEach(s=>rec.push({...s,id})));
  rec.sort((a,b)=>frTs(b.date)-frTs(a.date));
  const tile=(n,l,t)=>`<button class="tile" data-a="tab" data-v="${t}"><b>${esc(n)}</b><span>${l}</span></button>`;
  const stale=sessCount()&&Date.now()-db.bak>30*864e5;
  return `<div class="hero"><small style="color:var(--tx2)">Dernière compétition importée</small><strong>${esc(last)}</strong>
    <small style="color:var(--tx2)">${db.res.length} résultats</small><div style="margin-top:14px"><button class="btn" data-a="pdf">Importer un PDF</button></div></div>
    ${stale?'<button class="row" data-a="exp" style="margin-top:10px;border-color:var(--bad)"><div class="rw"><b>Pense à sauvegarder</b><small>Dernière sauvegarde il y a plus d\'un mois. Touche pour exporter.</small></div></button>':''}
    <div class="grid">${tile(nas,'nageurs ASVF','sw')}${tile(db.res.length,'résultats','res')}${tile(sessCount(),'chronos d\'entraînement','sw')}${tile([...new Set(db.res.map(seas).filter(Boolean))].sort().pop()||'—','saison en cours','res')}</div>
    <h2>Derniers chronos d'entraînement</h2>`+
    (rec.slice(0,5).map(s=>`<button class="row" data-a="fiche" data-id="${esc(s.id)}"><div class="rw"><b>${esc(db.sw[s.id]?.prenom)} ${esc(db.sw[s.id]?.nom)}</b><small>${esc(s.nage)} ${esc(s.dist)} · ${esc(s.date)}</small></div><div class="tm">${esc(s.time)}</div></button>`).join('')||'<div class="empty">Aucun chrono. Ouvre l\'onglet Séance pour en saisir.</div>')}
const mmss=n=>Math.floor(n/6000)+':'+((n%6000)/100).toFixed(2).padStart(5,'0');
function chartRes(l){
  const d=l.slice(0,40);if(!d.length)return'<div class="empty">Aucun résultat.</div>';
  const min=d[0].tn,rg=Math.max(d[d.length-1].tn-min,1),H=27,L=118,A=360-L-62;
  const bars=d.map((r,i)=>{const w=Math.round(30+(A-30)*(1-(r.tn-min)/rg)),c=i<5?'var(--bad)':r.asvf?'var(--ok)':'var(--ac)',nm=(i+1)+'. '+r.prenom[0]+'. '+r.nom;
    return `<g data-a="fiche" data-id="${esc(r.id)}" style="cursor:pointer"><text x="0" y="${i*H+17}">${esc(nm.length>19?nm.slice(0,18)+'…':nm)}</text><rect x="${L}" y="${i*H+4}" width="${w}" height="${H-9}" rx="4" style="fill:${c}"/><text x="${L+w+5}" y="${i*H+17}" style="fill:var(--tx)">${esc(r.real)}</text></g>`}).join('');
  return `<svg class="cht" viewBox="0 0 360 ${d.length*H+4}" role="img" aria-label="Classement des temps">${bars}</svg><small>Barre plus longue = plus rapide.${l.length>40?' '+l.length+' résultats, les 40 premiers sont affichés.':''} <span style="color:var(--bad)">■</span> top 5 <span style="color:var(--ok)">■</span> ASVF <span style="color:var(--ac)">■</span> autres. Touche une barre pour ouvrir la fiche.</small>`}
function chartEvo(hist,ts){
  const p=[...hist.map(r=>({t:r.tn,k:'c',s:frTs(r.date)})),...ts.map(x=>({t:x.t,k:'t',s:frTs(x.date)}))].filter(x=>isFinite(x.t)).sort((a,b)=>a.s-b.s);
  if(p.length<2)return'';
  const mn=Math.min(...p.map(x=>x.t)),mx=Math.max(...p.map(x=>x.t)),rg=Math.max(mx-mn,1),W=340,Hh=150,l=50,r=12,t=14,b=26,pw=W-l-r,ph=Hh-t-b;
  const X=i=>l+i*pw/(p.length-1),Y=v=>t+(v-mn)/rg*ph,rec=hist.length?Math.min(...hist.map(x=>x.tn)):null;
  return `<svg class="cht" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Évolution des chronos"><text x="0" y="${t+4}">${mmss(mn)}</text><text x="0" y="${t+ph+4}">${mmss(mx)}</text>`+
   `<line x1="${l}" x2="${W-r}" y1="${t+ph}" y2="${t+ph}" style="stroke:var(--ln)"/>`+
   (rec!==null?`<line x1="${l}" x2="${W-r}" y1="${Y(rec)}" y2="${Y(rec)}" style="stroke:var(--ac);stroke-dasharray:4 4;opacity:.6"/>`:'')+
   `<polyline points="${p.map((x,i)=>X(i).toFixed(1)+','+Y(x.t).toFixed(1)).join(' ')}" style="fill:none;stroke:var(--tx3);stroke-width:1.5"/>`+
   p.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.t).toFixed(1)}" r="4.5" style="fill:${x.k==='c'?'var(--ac)':'var(--ok)'}"/>`).join('')+
   `<text x="${l}" y="${Hh-6}">plus ancien</text><text x="${W-r}" y="${Hh-6}" text-anchor="end">plus récent</text></svg><small><span style="color:var(--ac)">●</span> compétition <span style="color:var(--ok)">●</span> entraînement · haut du graphique = plus rapide · pointillés = record</small>`}
function pgRes(){const f=S.f,sel=(k,l,a)=>`<div><label>${l}</label><select data-i="f" data-k="${k}">${opts(a,f[k],'Tous')}</select></div>`;
  const n=Object.values(f).filter(Boolean).length;
  return `<div class="f full"><input class="full" type="search" placeholder="Rechercher un nageur…" data-i="fq" value="${esc(f.q)}"></div>
  <details${n>(f.q?1:0)?' open':''}><summary>Filtres${n?' ('+n+')':''}</summary><div class="f" style="margin-top:8px">
  ${sel('saison','Saison',[...new Set(db.res.map(seas).filter(Boolean))].sort().reverse())}${sel('nage','Nage',uniq('nage'))}${sel('dist','Distance',DISTS)}
  <div><label>Sexe</label><select data-i="f" data-k="hf">${opts(['H','F'],f.hf,'Tous')}</select></div>${sel('age','Âge',uniq('age'))}
  <div><label>Club</label><select data-i="f" data-k="club"><option value="">Tous</option><option value="asvf"${f.club==='asvf'?' selected':''}>ASVF</option><option value="other"${f.club==='other'?' selected':''}>Autres</option></select></div></div>
  <button class="chip" data-a="rst">Réinitialiser</button></details><div class="chips" style="margin-top:10px"><button class="chip${(S.rv||'list')==='list'?' on':''}" data-a="rv" data-v="list">Liste</button><button class="chip${S.rv==='chart'?' on':''}" data-a="rv" data-v="chart">Graphique</button></div><div id="rl"></div>`}
function drawRes(){const f=S.f,rk=f.nage&&f.dist,l=bests(f);
  rk?l.sort((a,b)=>a.tn-b.tn):l.sort((a,b)=>nameSort(a,b)||(DO[a.dist]||9)-(DO[b.dist]||9));
  const top=l.length?l[0].tn:1;
  if(S.rv==='chart'){$('#rl').innerHTML=rk?chartRes(l):'<div class="empty">Choisis une nage et une distance pour voir le graphique.</div>';return}
  $('#rl').innerHTML=(rk?'':'<small>Choisis une nage et une distance pour afficher le classement.</small>')+
    l.slice(0,150).map((r,i)=>`<button class="row${r.asvf?' asvf':''}${rk&&i<5?' top':''}" data-a="fiche" data-id="${esc(r.id)}">${rk?`<span class="rk">${i+1}</span>`:''}
    <div class="rw"><b>${esc(r.prenom)} ${esc(r.nom)}${r.asvf?'<span class="bd">ASVF</span>':''}</b><small>${rk?'':esc(r.nage+' '+r.dist)+' · '}${r.club?esc(r.club)+' · ':''}${esc(r.age)} · ${esc(r.date||'—')}</small>${rk?`<div class="bar" style="width:${Math.round(top/r.tn*100)}%"></div>`:''}</div>
    <div class="tm">${esc(r.real)}<small>eng. ${esc(r.eng||'—')}</small></div></button>`).join('')||'<div class="empty">Aucun résultat.</div>'+
    (l.length>150?`<small>${l.length-150} résultats de plus : affine les filtres.</small>`:'')}
function pgSes(){const s=S.ses;
  return `<div class="f c3"><div><label>Date</label><input type="date" data-i="sdate" value="${s.date}"></div>
  <div><label>Nage</label><select data-i="sn">${opts(nagesAll(),s.nage,'Choisir…')}</select></div>
  <div><label>Distance</label><select data-i="sd">${opts(DISTS,s.dist,'Choisir…')}</select></div>
  <div class="full"><input type="search" placeholder="Rechercher un nageur…" data-i="sq" value="${esc(s.q)}"></div></div>
  <small>Épreuve du groupe. Touche « Épreuve » sur une ligne pour la changer pour un seul nageur.</small><div id="sl" style="margin-top:8px"></div>
  <button class="btn w save" data-a="ssave">Enregistrer les chronos</button>`}
function drawSes(){const q=norm(S.ses.q),nages=nagesAll();
  const l=Object.entries(db.sw).filter(([id,s])=>s.asvf&&!db.hid.includes(id)&&(!q||norm(s.nom+' '+s.prenom).includes(q))).sort((a,b)=>swSort(a[1],b[1]));
  $('#sl').innerHTML=l.map(([id,s],i)=>{const e=S.ses.ep[id]||{nage:S.ses.nage,dist:S.ses.dist},ok=e.nage&&e.dist,rec=ok&&bestOf(id,e.nage,e.dist),I=esc(id);
    return ageHead(l,s,i)+`<div class="row ses"><div class="rw"><b>${esc(s.prenom)} ${esc(s.nom)}</b><small>${rec?'Record '+esc(rec.real):ok?'Pas encore de record':'Choisis une épreuve'}</small></div>
    <button class="chip${ok?'':' warn'}" data-a="sopen" data-id="${I}">${ok?esc(e.nage+' '+e.dist):'Épreuve'} ▾</button>
    <input class="ti" inputmode="numeric" placeholder="0:00.00" data-i="t" data-id="${I}" value="${esc(S.ses.vals[id]||'')}">
    ${S.ses.open===id?`<div class="pk"><select data-i="sep" data-id="${I}" data-k="nage">${opts(nages,e.nage,'Nage…')}</select><select data-i="sep" data-id="${I}" data-k="dist">${opts(DISTS,e.dist,'Distance…')}</select></div>`:''}
    <input class="ob" placeholder="Observation (optionnel)" data-i="o" data-id="${I}" value="${esc(S.ses.obs[id]||'')}"></div>`}).join('')||'<div class="empty">Aucun nageur ASVF. Ajoute-en depuis l\'onglet Nageurs.</div>'}
function pgSw(){const nv=S.nv,sg=(v,l)=>`<button class="chip${nv===v?' on':''}" data-a="nv" data-v="${v}">${l}</button>`;
  return `<div class="chips">${sg('asvf','ASVF')}${sg('all','Tous')}${sg('hid','Masqués ('+db.hid.length+')')}</div>
  <div class="f full"><input type="search" placeholder="Rechercher un nageur…" data-i="nq" value="${esc(S.nq)}"></div>
  <button class="btn g w" data-a="add" style="margin-bottom:10px">＋ Ajouter un nageur</button><div id="nl"></div>`}
function drawSw(){const q=norm(S.nq),h=S.nv==='hid';
  const l=Object.entries(db.sw).filter(([id,s])=>(h?db.hid.includes(id):!db.hid.includes(id)&&(S.nv==='all'||s.asvf))&&(!q||norm(s.nom+' '+s.prenom).includes(q))).sort((a,b)=>swSort(a[1],b[1]));
  $('#nl').innerHTML=l.map(([id,s],i)=>{const n=(db.tr[id]||[]).length;
    return ageHead(l,s,i)+`<div class="row${s.asvf?' asvf':''}" ${h?'':`data-a="fiche" data-id="${esc(id)}" role="button"`}><div class="av">${esc((s.prenom[0]||'')+(s.nom[0]||''))}</div>
    <div class="rw"><b>${esc(s.prenom)} ${esc(s.nom)}</b><small>${esc(s.age||'—')} · ${s.hf||''} · ${n} chrono${n>1?'s':''}</small></div>
    ${h?`<button class="chip" data-a="unhide" data-id="${esc(id)}">Réafficher</button>`:''}</div>`}).join('')||'<div class="empty">Aucun nageur.</div>'}
function pgSet(){return `<h2 style="margin-top:0">Compétitions</h2>
  <button class="btn w" data-a="pdf">Importer un PDF de résultats</button>
  ${db.imp.slice(0,5).map(i=>`<div class="hl"><span>${esc(i.label)}</span><small>${i.n} nouveaux résultats</small></div>`).join('')}
  <h2>Sauvegarde</h2><div class="f"><button class="btn g" data-a="exp">Exporter tout</button><div><input type="file" accept=".json" data-i="imp"></div></div>
  <small>L'export contient résultats, nageurs, chronos et masqués. L'import fusionne sans doublons : utile pour changer d'appareil ou partager. Il accepte aussi l'ancien export d'entraînement.</small>
  <h2>Informations</h2><div class="hl"><span>Résultats</span><b>${db.res.length}</b></div><div class="hl"><span>Nageurs</span><b>${Object.keys(db.sw).length}</b></div>
  <div class="hl"><span>Chronos d'entraînement</span><b>${sessCount()}</b></div><div class="hl"><span>Dernière sauvegarde</span><b>${db.bak?new Date(db.bak).toLocaleDateString('fr-FR'):'jamais'}</b></div>
  <h2>Zone sensible</h2><button class="btn d w" data-a="wipe">Réinitialiser l'appareil</button><small>Efface les chronos et nageurs de cet appareil, puis recharge la base de départ.</small>`}

/* ── Fiche nageur / ajout / import PDF (feuilles) ── */
function shFiche(){const id=S.sheet.id,s=db.sw[id];if(!s)return'';
  const rs=db.res.filter(r=>r.id===id),tr=db.tr[id]||[],hid=db.hid.includes(id);
  const eps=[...new Set([...rs,...tr].map(x=>x.nage+'|'+x.dist))].sort((a,b)=>(DO[a.split('|')[1]]||9)-(DO[b.split('|')[1]]||9)||a.localeCompare(b));
  const ep=eps.includes(S.sheet.ep)?S.sheet.ep:eps[0]||'';S.sheet.ep=ep;const[nage,dist]=ep.split('|');
  const hist=rs.filter(r=>r.nage===nage&&r.dist===dist).sort((a,b)=>frTs(b.date)-frTs(a.date)),rec=hist.reduce((a,b)=>!a||b.tn<a.tn?b:a,null);
  const ts=tr.map((x,i)=>({...x,i,t:tn(x.time)})).filter(x=>x.nage===nage&&x.dist===dist).sort((a,b)=>a.t-b.t),shown=S.sheet.all?ts:ts.slice(0,5);
  return `<header><h3>${esc(s.prenom)} ${esc(s.nom)}${s.asvf?'<span class="bd">ASVF</span>':''}</h3>
    <button class="chip" data-a="${hid?'unhide':'hide'}" data-id="${esc(id)}">${hid?'Réafficher':'Masquer'}</button><button class="chip" data-a="close" aria-label="Fermer">✕</button></header>
    ${eps.length?`<div class="chips">${eps.map(e=>`<button class="chip${e===ep?' on':''}" data-a="ep" data-v="${esc(e)}">${esc(e.replace('|',' '))}</button>`).join('')}</div>`:'<div class="empty">Aucune donnée pour ce nageur.</div>'}
    ${rec?`<div class="rec"><small>Record compétition</small><b>${esc(rec.real)}</b><small>${rankOf(rec)} en ${esc(rec.age)} ${rec.hf} · ${esc(rec.date||'—')}</small></div>`:''}
    ${chartEvo(hist,ts)}
    ${ep?`<h2 style="margin-top:6px">Entraînement${ts.length?' · meilleurs chronos':''}</h2>`:''}
    ${shown.map(x=>{const d=rec?x.t-rec.tn:null;return `<div class="tr"><div><b style="font-size:17px;font-variant-numeric:tabular-nums">${esc(x.time)}</b>${d===null?'':`<em class="${d<=0?'up':'dn'}">${d<=0?'▼':'▲'} ${secs(Math.abs(d))}s</em>`}<br><small>${esc(x.date)}</small>${x.obs?`<p>${esc(x.obs)}</p>`:''}</div><button class="chip" data-a="delses" data-i="${x.i}" aria-label="Supprimer">🗑</button></div>`}).join('')||(ep?'<div class="empty">Aucun chrono. Saisis-en depuis l\'onglet Séance.</div>':'')}
    ${ts.length>5?`<button class="chip" style="margin-top:8px" data-a="all">${S.sheet.all?'Afficher le top 5':'Voir les '+ts.length+' chronos'}</button>`:''}
    ${hist.length?`<details><summary>Compétitions (${hist.length})</summary>${hist.map(r=>`<div class="hl"><span>${esc(r.date||'—')}</span><b>${esc(r.real)}</b><small>eng. ${esc(r.eng||'—')}</small></div>`).join('')}</details>`:''}`}
function shAdd(){return `<header><h3>Ajouter un nageur</h3><button class="chip" data-a="close">✕</button></header>
  <div class="f"><div><label>Nom</label><input id="a-nom" autocapitalize="characters"></div><div><label>Prénom</label><input id="a-pre"></div>
  <div><label>Sexe</label><select id="a-hf"><option>H</option><option>F</option></select></div>
  <div><label>Tranche d'âge</label><select id="a-age">${['8 ans ou moins','9-10 ans','11-12 ans','13-14 ans','15-16 ans','17-19 ans','20-29 ans','31-39 ans','40 ans et +'].map(a=>`<option>${a}</option>`).join('')}</select></div>
  <div class="full"><label>Club</label><select id="a-club"><option value="1" selected>ASVF</option><option value="0">Autre</option></select></div></div>
  <button class="btn w" data-a="addgo">Ajouter</button>`}
function shPdf(){const p=S.pdf;
  return `<header><h3>Importer un PDF</h3><button class="chip" data-a="close">✕</button></header>
  <div class="f"><div class="full"><label>Fichier(s) PDF UFOLEP / GESCOMNAT : tu peux en choisir plusieurs d'un coup</label><input type="file" accept=".pdf" multiple data-i="pdffile"></div>
  <div class="full"><label>Date de la compétition (facultatif, sinon le n° de journée du PDF est utilisé)</label><input type="date" data-i="pdfdate" value="${S.pdfdate}"></div></div>
  <div id="pdfst">${p===null?'':p==='load'?'<small>Lecture du PDF…</small>':p.err?`<div class="empty" style="color:var(--bad)">${esc(p.err)}</div>`:
   `<div class="rec"><b>${p.res.length}</b><small>résultats détectés · ${esc(p.journee)}${p.forf.length?' · '+p.forf.length+' forfait(s)':''}</small></div>${p.res.slice(0,6).map(r=>`<div class="hl"><span>${esc(r.prenom)} ${esc(r.nom)}</span><small>${esc(r.nage+' '+r.dist)}</small><b>${esc(r.tpsRealise)}</b></div>`).join('')}`}</div>
  <button class="btn w" style="margin-top:12px" data-a="pdfgo"${p&&p.res&&p.res.length?'':' disabled'}>Intégrer les résultats</button>`}
function drawSheet(){const sh=S.sheet,el=$('#sh');
  if(!sh){el.innerHTML='';document.body.style.overflow='';return}
  el.innerHTML=`<div class="ov" data-a="close"><div class="sh" role="dialog" aria-modal="true">${sh.t==='fiche'?shFiche():sh.t==='add'?shAdd():shPdf()}</div></div>`;document.body.style.overflow='hidden'}

/* ── Rendu ── */
function render(){const t=TABS.find(x=>x[0]===S.tab);
  $('#bar').innerHTML=`<span class="logo">ASVF</span><h1>${t[2]}</h1>`;
  $('#app').innerHTML={home:pgHome,res:pgRes,ses:pgSes,sw:pgSw,set:pgSet}[S.tab]();
  $('#nav').innerHTML=TABS.map(x=>`<button class="${x[0]===S.tab?'on':''}" data-a="tab" data-v="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('');
  if(S.tab==='res')drawRes();if(S.tab==='ses')drawSes();if(S.tab==='sw')drawSw();drawSheet()}

/* ── Actions ── */
const A={
  tab(d){S.tab=d.v;S.sheet=null;scrollTo(0,0);render()},
  rst(){S.f={saison:'',nage:'',dist:'',hf:'',age:'',club:'',q:''};render()},
  rv(d){S.rv=d.v;render()},
  fiche(d){S.sheet={t:'fiche',id:d.id,ep:'',all:false};drawSheet()},
  ep(d){S.sheet.ep=d.v;S.sheet.all=false;drawSheet()},all(){S.sheet.all=!S.sheet.all;drawSheet()},
  close(){S.sheet=null;drawSheet()},
  hide(d){db.hid.push(d.id);save();S.sheet=null;toast('Nageur masqué');render()},
  unhide(d){db.hid=db.hid.filter(x=>x!==d.id);save();S.sheet=null;toast('Nageur réaffiché');render()},
  nv(d){S.nv=d.v;render()},add(){S.sheet={t:'add'};drawSheet()},
  addgo(){const nom=$('#a-nom').value.trim().toUpperCase(),pre=$('#a-pre').value.trim();if(!nom||!pre)return toast('⚠️ Nom et prénom obligatoires');
    const id=norm(nom)+'|'+norm(pre);if(db.sw[id])return toast('⚠️ Ce nageur existe déjà');
    db.sw[id]={nom,prenom:pre[0].toUpperCase()+pre.slice(1).toLowerCase(),hf:$('#a-hf').value,age:$('#a-age').value,asvf:$('#a-club').value==='1'};
    save();S.sheet=null;toast('✅ '+pre+' '+nom+' ajouté');render()},
  pdf(){S.pdf=null;S.sheet={t:'pdf'};drawSheet()},
  pdfgo(){const p=S.pdf;if(!p||!p.res)return;const label=iso2fr(S.pdfdate)||p.journee;let n=0;
    [...p.res,...p.forf].forEach(r=>{if(addRes(db,{nom:r.nom,prenom:r.prenom,club:r.club,asvf:r.asvf,hf:r.hf,age:r.age,nage:r.nage,dist:r.distance,date:label,saison:season(label)||season(iso2fr(isoNow())),eng:r.tpsEng,real:r.tpsRealise}))n++});
    db.imp.unshift({label,n,ts:Date.now()});save();S.sheet=null;S.pdf=null;S.pdfdate='';toast('✅ '+n+' nouveaux résultats ('+(p.res.length-n)+' déjà connus)');render()},
  exp(){db.bak=Date.now();save();const b=new Blob([JSON.stringify({type:'backup',v:1,db})],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='asvf_natation_'+isoNow()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('📤 Sauvegarde téléchargée');if(S.tab==='home'||S.tab==='set')render()},
  wipe(){if(confirm('Effacer toutes les données de cet appareil ?')&&confirm('Vraiment ? Pense à exporter une sauvegarde avant.')){localStorage.removeItem(KEY);location.reload()}},
  delses(d){if(!confirm('Supprimer ce chrono ?'))return;db.tr[S.sheet.id].splice(+d.i,1);save();drawSheet();toast('Chrono supprimé')},
  sopen(d){S.ses.open=S.ses.open===d.id?'':d.id;drawSes()},
  ssave(){const s=S.ses,date=iso2fr(s.date);if(!date)return toast('⚠️ Choisis une date');let n=0,bad=0;
    Object.keys(s.vals).forEach(id=>{const t=(s.vals[id]||'').trim();if(!t)return;const e=s.ep[id]||{nage:s.nage,dist:s.dist};
      if(!/^\d+:\d{2}\.\d{2}$/.test(t)||!e.nage||!e.dist){bad++;return}
      (db.tr[id]=db.tr[id]||[]).push({date,time:t,nage:e.nage,dist:e.dist,obs:(s.obs[id]||'').trim()});delete s.vals[id];delete s.obs[id];n++});
    if(n)save();drawSes();toast(n?`✅ ${n} chrono${n>1?'s':''} enregistré${n>1?'s':''}${bad?' · '+bad+' à corriger':''}`:bad?`⚠️ ${bad} chrono(s) incomplet(s) : épreuve ou temps à vérifier`:'Saisis au moins un chrono')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;
  if(t.classList.contains('ov')&&e.target!==t)return;const f=A[t.dataset.a];f&&f(t.dataset)});
document.addEventListener('input',e=>{const t=e.target,i=t.dataset.i;if(!i)return;
  if(i==='t'){t.value=fmtT(t.value);S.ses.vals[t.dataset.id]=t.value}else if(i==='o')S.ses.obs[t.dataset.id]=t.value;
  else if(i==='fq'){S.f.q=t.value;drawRes()}else if(i==='sq'){S.ses.q=t.value;drawSes()}else if(i==='nq'){S.nq=t.value;drawSw()}});
document.addEventListener('change',e=>{const t=e.target,i=t.dataset.i;if(!i)return;
  if(i==='f'){S.f[t.dataset.k]=t.value;render()}
  else if(i==='sn'){S.ses.nage=t.value;drawSes()}else if(i==='sd'){S.ses.dist=t.value;drawSes()}else if(i==='sdate')S.ses.date=t.value;
  else if(i==='sep'){const id=t.dataset.id,c=S.ses.ep[id]||{nage:S.ses.nage,dist:S.ses.dist};S.ses.ep[id]={...c,[t.dataset.k]:t.value};drawSes()}
  else if(i==='pdfdate')S.pdfdate=t.value;else if(i==='pdffile')readPdf(t.files);else if(i==='imp')readBackup(t.files[0])});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)A.close()});

/* ── Import / export JSON ── */
function mergeTr(id,arr){const t=db.tr[id]||(db.tr[id]=[]);let n=0;arr.forEach(s=>{if(!t.some(e=>e.date===s.date&&e.time===s.time&&e.nage===s.nage&&e.dist===s.dist)){t.push(s);n++}});return n}
function readBackup(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const p=JSON.parse(rd.result);let n=0;
  if(p.type==='backup'&&p.db){const x=p.db;(x.res||[]).forEach(r=>{if(addRes(db,{...r}))n++});
    Object.entries(x.sw||{}).forEach(([id,s])=>{if(!db.sw[id])db.sw[id]=s});Object.entries(x.tr||{}).forEach(([id,a])=>n+=mergeTr(id,a));
    db.hid=[...new Set([...db.hid,...(x.hid||[])])]}
  else if(p.type==='training'&&p.sessions){Object.entries(p.sessions).forEach(([k,a])=>{const[nom,pre]=k.split('|');n+=mergeTr(norm(nom)+'|'+norm(pre),a)})}
  else return toast('❌ Fichier non reconnu');save();toast('✅ '+n+' éléments ajoutés');render()}catch{toast('❌ Fichier illisible')}};rd.readAsText(file)}

/* ── Import PDF (PDF.js, gratuit, dans le navigateur) ── */
function loadPdfJs(){return window.pdfjsLib?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok()};
  s.onerror=()=>ko(new Error('Connexion requise pour lire le PDF (bibliothèque non chargée).'));document.head.appendChild(s)})}
async function readPdf(files){if(!files||!files.length)return;S.pdf='load';drawSheet();
  try{await loadPdfJs();const pages=[];
    for(const file of files){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
      for(let p=1;p<=pdf.numPages;p++){const c=await(await pdf.getPage(p)).getTextContent();pages.push(c.items.map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5]})).filter(i=>i.s))}}
    const r=parseUfolep(pages);S.pdf=r.res.length?r:{err:'Aucun résultat reconnu : ce PDF n\'est pas au format UFOLEP / GESCOMNAT.'}}
  catch(e){S.pdf={err:e.message||'PDF illisible'}}drawSheet()}
/* Lecture par colonnes (position x/y) : robuste aux noms sur 2 lignes et aux sauts de page */
function parseUfolep(pages){
  const LI=/^(\d{3}_\d+|[A-Z]{2}\d+|A_completer)$/,TR=/^\d+:\d{2}\.\d{2}$/,JO=/Journ.e\s+(\d+)/i,
    EP=/Résultat de l.epreuve\s+(\d+m)\s+(.+?)\s+(Dames|Messieurs)/i,AG=/^(?:[A-Z0-9]\s*:\s*)?(\d+(?:\s*-\s*\d+)?\s+ans(?:\s+(?:et|ou)\s+\S+)?)$/i,
    HEAD=new Set(['Club','Nom','Prénom','Licence','Année','Tps','Eng.','Réalisé','D/M/A/F','Points']),
    AGE={'8 ans et moins':'8 ans ou moins','9 - 10 ans':'9-10 ans','11 - 12 ans':'11-12 ans','13 - 14 ans':'13-14 ans','15 - 16 ans':'15-16 ans','17 - 19 ans':'17-19 ans','20 - 29 ans':'20-29 ans','30 - 39 ans':'31-39 ans','40 ans et plus':'40 ans et +','40 ans et +':'40 ans et +'},
    cap=s=>s.toLowerCase().replace(/(^|[-\s])\p{L}/gu,m=>m.toUpperCase()),
    joinP=a=>{let s='',px=null;a.forEach(i=>{s=s&&s.endsWith('-')&&Math.abs(i.x-px)<2?s+i.s:(s?s+' ':'')+i.s;px=i.x});return s};
  let journee=null,prev=null;const cur={},res=[],forf=[];
  for(const items of pages){
    const lines=[];[...items].sort((a,b)=>b.y-a.y).forEach(i=>{const L=lines[lines.length-1];if(L&&Math.abs(L.y-i.y)<=3)L.it.push(i);else lines.push({y:i.y,it:[i]})});
    const ev=[],skip=new Set();
    lines.forEach(L=>{L.it.sort((a,b)=>a.x-b.x);const t=L.it.map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();let k=null;
      const jm=JO.exec(t),em=EP.exec(t),am=AG.exec(t);
      if(em)k={y:L.y,ep:em};else if(am)k={y:L.y,age:am[1].replace(/\s+/g,' ').trim()};else if(jm)k={y:L.y,jo:jm[1]};
      if(k||/BAPE|^page \d|^Club /.test(t)){L.it.forEach(i=>skip.add(i));if(k)ev.push(k)}});
    const anc=items.filter(i=>LI.test(i.s)).sort((a,b)=>b.y-a.y),bk=anc.map(()=>[]);
    items.forEach(i=>{if(skip.has(i)||HEAD.has(i.s))return;let b=-1,d=19;anc.forEach((a,n)=>{const e=Math.abs(a.y-i.y);if(e<d){d=e;b=n}});if(b>=0)bk[b].push(i)});
    if(prev&&prev.nom.endsWith('-')&&anc.length){const o=bk[0].filter(i=>i.y>anc[0].y+3&&/^[A-Z][A-Z'\-]+$/.test(i.s)).sort((p,q)=>q.y-p.y)[0];if(o){prev.nom+=o.s;bk[0]=bk[0].filter(i=>i!==o)}}
    anc.forEach((a,n)=>ev.push({y:a.y,row:n}));ev.sort((p,q)=>q.y-p.y||(p.row===undefined?-1:1));
    for(const e of ev){
      if(e.jo&&!journee)journee='Journée '+e.jo;
      if(e.ep){cur.dist=e.ep[1];cur.nage=e.ep[2].trim();cur.hf=e.ep[3].toLowerCase()==='dames'?'F':'H'}
      if(e.age)cur.age=AGE[e.age]||e.age.replace(/\s*-\s*/,'-');
      if(e.row===undefined)continue;
      const t=joinP(bk[e.row].sort((p,q)=>Math.abs(p.x-q.x)<2?q.y-p.y:p.x-q.x)).split(' '),li=t.indexOf(anc[e.row].s);
      if(li<2||!(cur.dist&&cur.nage&&cur.hf&&cur.age))continue;
      const np=t.slice(1,li);if(np.length<2)continue;const tm=t.slice(li+1).filter(x=>TR.test(x));if(tm.length<2)continue;
      const r={nom:np.slice(0,-1).join(' ').toUpperCase(),prenom:cap(np[np.length-1]),club:t[0],asvf:t[0].toUpperCase().includes('ASVF'),nage:cur.nage,distance:cur.dist,hf:cur.hf,age:cur.age,tpsEng:tm[0],tpsRealise:tm[1]};
      prev=r;(tm[1]==='0:00.00'?forf:res).push(r)}}
  return{journee:journee||'Journée ?',res,forf}}


render();
</script></body></html>
